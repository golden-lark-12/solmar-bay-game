<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solmar Bay — Open-World Crime Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1210;
    font-family: "Segoe UI", system-ui, sans-serif; color: #fff; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #hud-top { position: absolute; top: 14px; left: 0; right: 0; display: flex;
    justify-content: space-between; align-items: flex-start; padding: 0 18px; }
  #hud-stars { font-size: 26px; letter-spacing: 4px; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  #hud-objective { background: rgba(10,10,16,.62); border: 1px solid rgba(255,210,58,.5);
    border-radius: 6px; padding: 8px 14px; font-size: 15px; font-weight: 600;
    max-width: 520px; text-align: center; }
  #hud-cash { font-size: 24px; font-weight: 800; color: #7dd87d; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-bottom { position: absolute; left: 18px; bottom: 16px; display: flex; gap: 14px; align-items: flex-end; }
  #hud-health { width: 210px; height: 20px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4);
    border-radius: 10px; position: relative; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #58d858; border-radius: 10px; }
  #hud-health-num { position: absolute; inset: 0; text-align: center; font-size: 12px; line-height: 20px; font-weight: 700; }
  #hud-ammo { font-size: 17px; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.8); }
  #hud-speed { font-size: 26px; font-weight: 800; color: #ffd23a; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #minimap { position: absolute; right: 16px; bottom: 16px; width: 190px; height: 190px;
    border: 2px solid rgba(255,255,255,.45); border-radius: 50%; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  #hud-prompt { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
    background: rgba(10,10,16,.7); padding: 8px 16px; border-radius: 6px; font-size: 16px; font-weight: 600; }
  #hud-toast { position: absolute; left: 50%; top: 84px; transform: translateX(-50%);
    background: rgba(10,10,16,.75); border: 1px solid rgba(255,210,58,.6); color: #ffd23a;
    padding: 9px 18px; border-radius: 6px; font-size: 16px; font-weight: 700;
    opacity: 0; transition: opacity .3s; white-space: nowrap; }
  #hud-timer { position: absolute; left: 50%; top: 132px; transform: translateX(-50%);
    font-size: 22px; font-weight: 800; color: #4ad8ff; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #hud-mute { position: absolute; right: 18px; top: 64px; font-size: 12px; color: rgba(255,255,255,.6); }
  #menu { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(30,10,20,.55), rgba(10,8,20,.82)); z-index: 10; text-align: center; }
  #menu-title { font-size: 76px; font-weight: 900; letter-spacing: 6px; margin: 0;
    color: #ffd23a; text-shadow: 0 4px 0 #a03a20, 0 10px 30px rgba(0,0,0,.8); }
  #menu-sub { font-size: 17px; max-width: 560px; margin: 14px 0 30px; color: #f0e0d0; line-height: 1.5; }
  #menu-buttons { display: flex; flex-direction: column; gap: 12px; align-items: center; }
  .menu-btn { pointer-events: auto; cursor: pointer; font-size: 19px; font-weight: 700; color: #fff;
    background: linear-gradient(180deg, #c0392b, #8e2418); border: 1px solid #ffd23a; border-radius: 8px;
    padding: 12px 34px; min-width: 280px; }
  .menu-btn:hover { background: linear-gradient(180deg, #d84a35, #a02a1a); }
  #menu-help { margin-top: 22px; font-size: 13px; color: rgba(255,255,255,.75); max-width: 640px; line-height: 1.7; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; transition: opacity .4s; z-index: 9; }
  #overlay .big { font-size: 84px; font-weight: 900; letter-spacing: 8px; color: #ff4040;
    text-shadow: 0 4px 0 #600, 0 10px 30px rgba(0,0,0,.9); }
  #overlay .small { font-size: 18px; color: #fff; background: rgba(0,0,0,.6); padding: 8px 18px; border-radius: 6px; margin-top: 10px; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 62%, rgba(20,8,4,.38) 100%); }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar Bay: open-world crime game"></canvas>
<div id="vignette"></div>
<div id="hud"></div>
<div id="menu"><h1 id="menu-title">SOLMAR BAY</h1><p id="menu-sub"></p><div id="menu-buttons"></div></div>
<div id="overlay"></div>
<script src="./vendor/three.min.js"></script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
